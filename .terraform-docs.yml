# `just docs` writes the inputs and outputs tables into README.md between the
# BEGIN_TF_DOCS and END_TF_DOCS markers. CI fails when they are out of date.
formatter: markdown table

version: ">= 0.24.0, < 1.0.0"

sections:
  show:
    - requirements
    - providers
    - resources
    - inputs
    - outputs

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: true
  html: true
  indent: 3
  lockfile: false
  required: true
  sensitive: true
  type: true
